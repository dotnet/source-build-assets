trigger: none
pr: none

variables:
- template: /eng/common/templates/variables/pool-providers.yml@self

- name: skipComponentGovernanceDetection  # we run CG on internal builds only
  value: true

- name: Codeql.Enabled  # we run CodeQL on internal builds only
  value: false

resources:
  repositories:
  - repository: vmr
    type: github
    name: dotnet/dotnet
    endpoint: public
    # AzDO pipeline names must follow source-build-assets-unified-build-<main|N>:
    # -main selects VMR main; a major version suffix (e.g. -11) selects release/N.0.1xx.
    ref: >-
      ${{ iif(
        eq(variables['Build.DefinitionName'], 'source-build-assets-unified-build-main'),
        'refs/heads/main',
        format('refs/heads/release/{0}.0.1xx', replace(variables['Build.DefinitionName'], 'source-build-assets-unified-build-', ''))
      ) }}

stages:
- template: /eng/pipelines/templates/stages/vmr-build.yml@vmr
  parameters:
    isBuiltFromVmr: false
    verifications: [ "source-build-stage1" ]
    scope: lite
